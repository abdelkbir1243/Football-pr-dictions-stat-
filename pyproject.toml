[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "footpred"
version = "4.0.0"
description = "Modèle statistique de prédiction des matchs de football (projet académique)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "statsmodels>=0.14", "matplotlib>=3.7", "openpyxl>=3.1"]

[tool.setuptools]
packages = ["footpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
